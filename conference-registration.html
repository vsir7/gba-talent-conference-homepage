<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>大会报名</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235740F2'/%3E%3C/svg%3E"><link rel="stylesheet" href="service-batch-06.css"></head><body><main class="batch6-shell" data-ui-ready="false"><header class="batch6-header"><div class="batch6-bar"><button class="batch6-back" type="button" data-back aria-label="返回">‹</button><h1>大会报名</h1><span></span></div><div class="batch6-summary"><h2>第四届粤港澳大湾区人才高质量发展大会</h2><p>▣　10月25日—10月26日　　⌖　东莞·松山湖</p></div></header><form class="batch6-page" id="registration-form"><section class="batch6-card registration-card"><h2>选择报名身份</h2><div class="role-grid" role="radiogroup" aria-label="报名身份"><button type="button" class="is-active" role="radio" aria-checked="true"><strong>♟</strong>普通参会人员</button><button type="button" role="radio" aria-checked="false"><strong>♬</strong>媒体</button><button type="button" role="radio" aria-checked="false"><strong>▥</strong>企业</button><button type="button" role="radio" aria-checked="false"><strong>▰</strong>高校</button><button type="button" role="radio" aria-checked="false"><strong>▤</strong>机构</button><button type="button" role="radio" aria-checked="false"><strong>♜</strong>选手</button><button type="button" role="radio" aria-checked="false"><strong>★</strong>嘉宾</button></div></section><section class="batch6-card registration-card"><h2>报名信息</h2><div class="registration-form"><label><span><em>*</em> 姓名</span><input name="name" autocomplete="name" placeholder="请输入姓名" required></label><label><span><em>*</em> 手机号</span><input name="phone" inputmode="tel" autocomplete="tel" placeholder="请输入手机号" required></label><label><span><em>*</em> 邮箱</span><input name="email" type="email" autocomplete="email" placeholder="请输入邮箱" required></label><label><span><em>*</em> 单位</span><input name="organization" placeholder="请输入单位名称" required></label><label><span>职务</span><input name="title" placeholder="请输入职务"></label></div></section><section class="batch6-card choice-card"><h2 class="choice-title">参会目的 <small>（多选）</small></h2><div class="chip-grid" data-multi-choice><button type="button">￥ 资金</button><button type="button">⌘ 技术</button><button type="button">♟ 团队</button><button type="button">▥ 产业</button><button type="button">▦ 应用场景</button><button type="button">♧ 人脉资源</button></div></section><section class="batch6-card choice-card"><h2 class="choice-title">合作需求 <small>（多选）</small></h2><div class="chip-grid" data-multi-choice><button type="button">￥ 资金</button><button type="button">⌘ 技术</button><button type="button">♟ 团队</button><button type="button">▥ 产业</button><button type="button">▦ 应用场景</button><button type="button">♧ 人脉资源</button></div></section><section class="batch6-card choice-card"><h2 class="choice-title">材料上传 <small>（可选）</small></h2><label class="upload-drop" for="registration-file"><span><strong>☁ 点击或拖拽文件上传</strong><small>支持 PDF、PPT、Word，单个文件不超过 20MB</small></span></label><input id="registration-file" type="file" hidden></section><section class="agreement"><label><input type="checkbox" required>我已阅读并同意《用户协议》和《隐私政策》</label><label><input type="checkbox">我同意接收本次大会的相关通知与资讯</label></section><button class="batch6-submit" type="submit">提交报名</button></form></main><p class="batch4-toast" id="batch4-toast" hidden></p><script type="module" src="service-batch-06.js"></script></body></html>
