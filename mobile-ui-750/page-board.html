<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>湾区人才大会 · 32 页移动端看板</title>
  <link rel="stylesheet" href="styles/board.css">
</head>
<body>
  <main class="board">
    <aside class="sidebar">
      <div class="brand"><small>HTDC 2026</small><h1>移动端页面看板</h1><p>32 个页面 · 固定 750px 画布<br>点击名称在右侧切换预览</p></div>
      <nav data-board-nav aria-label="页面列表"></nav>
    </aside>
    <section class="workspace">
      <header class="workspace-header"><div><h2 data-board-title>大会首页</h2><p data-board-status>正在初始化</p></div></header>
      <div class="viewport-shell"><iframe data-board-frame title="移动端页面预览"></iframe></div>
    </section>
  </main>
  <script type="module" src="scripts/board.js"></script>
</body>
</html>
