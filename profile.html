<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F8FF" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="第四届粤港澳大湾区人才高质量发展大会个人中心" />
  <title>我的｜第四届粤港澳大湾区人才高质量发展大会</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235740F2'/%3E%3Cpath d='M18 34l9 9 19-22' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <svg class="icon-defs" aria-hidden="true">
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 10a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M13 14h3M8 18h3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m7 12.5 3.2 3.2L17.5 8"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0Z"/></symbol>
    <symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 13h3v6H5a1 1 0 0 1-1-1zM20 13h-3v6h2a1 1 0 0 0 1-1zM17 19c0 2-2 2-4 2h-1"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9M11 12h10M17 8l4 4-4 4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10H3zM9 21v-6h6v6"/></symbol>
    <symbol id="i-service" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <main class="profile-shell" data-ui-ready="true">
    <header class="profile-hero">
      <svg class="profile-hero__scene" viewBox="0 0 375 180" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="scene-stroke" x1="0" x2="1"><stop stop-color="#C9BEFF" stop-opacity="0"/><stop offset=".62" stop-color="#A894FF" stop-opacity=".38"/><stop offset="1" stop-color="#7C64F5" stop-opacity=".14"/></linearGradient></defs>
        <g fill="none" stroke="url(#scene-stroke)" stroke-width="1"><path d="M0 42 120 169M0 132c67 26 126 30 200 10M139 150h236M263 150V98h7v52m4 0V72h7v78m4 0V89h10v61m4 0V60h8v90m4 0V105h13v45m4 0v-33h11v33m7 0V91h8v59"/><path d="M214 151c46-48 107-43 161 0M289 151c20-34 53-33 84 0M214 109l37-56 39 56M235 109l16-56 18 56"/><path d="M206 151c36-30 86-36 169-23M247 38c55 18 95 39 128 71"/></g>
      </svg>
      <button class="notification-button" type="button" data-notification aria-label="消息中心，有一条未读消息"><svg><use href="#i-bell"/></svg><span aria-hidden="true"></span></button>
      <div class="profile-identity">
        <img src="public/assets/profile/avatar-xiaowan.png" width="160" height="160" alt="张小湾头像" />
        <div><h1>张小湾</h1><p>普通参会人员</p></div>
      </div>
    </header>

    <div class="profile-content">
      <section class="profile-card attendance-card" aria-labelledby="attendance-title">
        <div class="attendance-card__head"><h2 id="attendance-title"><span aria-hidden="true"><svg><use href="#i-user"/></svg></span>我的参会</h2><p role="status"><svg aria-hidden="true"><use href="#i-check"/></svg>报名已通过</p></div>
        <div class="attendance-card__details">
          <dl>
            <div><dt><svg aria-hidden="true"><use href="#i-calendar"/></svg></dt><dd>10月25日—10月26日</dd></div>
            <div><dt><svg aria-hidden="true"><use href="#i-pin"/></svg></dt><dd>东莞 · 松山湖</dd></div>
            <div><dt><svg aria-hidden="true"><use href="#i-info"/></svg></dt><dd>现场出示动态结果页面即可</dd></div>
          </dl>
          <img src="public/assets/profile/attendance-card.png" width="340" height="300" alt="参会凭证通过示意" />
        </div>
        <button class="attendance-card__action" type="button" data-profile-action="参会详情">查看详情<svg aria-hidden="true"><use href="#i-chevron"/></svg></button>
      </section>

      <section class="profile-card congress-card" aria-labelledby="congress-title">
        <h2 class="section-title" id="congress-title">我的大会</h2>
        <div class="congress-grid">
          <button type="button" data-profile-action="我的日程"><img src="public/assets/profile/quick-schedule.png" width="112" height="118" alt=""/><strong>我的日程</strong><span>下一场 10:30</span></button>
          <button type="button" data-profile-action="我的开放麦"><img src="public/assets/profile/quick-open-mic.png" width="112" height="118" alt=""/><strong>我的开放麦</strong><span>报名通过</span></button>
          <button type="button" data-profile-action="餐饮权益"><img src="public/assets/profile/quick-dining.png" width="112" height="118" alt=""/><strong>餐饮权益</strong><span>今日可用</span></button>
          <button type="button" data-profile-action="合作需求"><img src="public/assets/profile/quick-cooperation.png" width="112" height="118" alt=""/><strong>合作需求</strong><span>需求与材料</span></button>
        </div>
      </section>

      <section class="profile-card other-card" aria-labelledby="other-title">
        <h2 class="section-title" id="other-title">其他</h2>
        <div class="other-list">
          <button type="button" data-profile-action="个人信息"><svg aria-hidden="true"><use href="#i-user"/></svg><span>个人信息</span><i aria-hidden="true"><svg><use href="#i-chevron"/></svg></i></button>
          <button type="button" data-profile-action="联系会务"><svg aria-hidden="true"><use href="#i-headset"/></svg><span>联系会务</span><i aria-hidden="true"><svg><use href="#i-chevron"/></svg></i></button>
          <button type="button" data-profile-action="退出登录"><svg aria-hidden="true"><use href="#i-logout"/></svg><span>退出登录</span><i aria-hidden="true"><svg><use href="#i-chevron"/></svg></i></button>
        </div>
      </section>
      <footer class="profile-footer">第四届粤港澳大湾区人才高质量发展大会<br/><span>v1.0.0</span></footer>
    </div>
  </main>

  <nav class="profile-tabbar" aria-label="主要导航"><div class="profile-tabbar__content">
    <a class="profile-tabbar__item" href="index.html"><svg><use href="#i-home"/></svg><span>大会</span></a>
    <a class="profile-tabbar__item" href="schedule.html"><svg><use href="#i-calendar"/></svg><span>日程</span></a>
    <button class="profile-tabbar__item profile-tabbar__assistant" type="button" data-profile-action="AI助手"><img src="public/assets/schedule/ai-assistant-orb.png" width="92" height="92" alt=""/><span>AI助手</span></button>
    <a class="profile-tabbar__item" href="entry-service.html"><svg><use href="#i-service"/></svg><span>服务</span></a>
    <a class="profile-tabbar__item is-current" href="profile.html" aria-current="page"><svg><use href="#i-user"/></svg><span>我的</span></a>
  </div></nav>

  <dialog class="profile-dialog" id="profile-dialog" aria-labelledby="profile-dialog-title"><div class="profile-dialog__panel"><button class="profile-dialog__close" type="button" data-dialog-close aria-label="关闭"><svg><use href="#i-close"/></svg></button><h2 id="profile-dialog-title">提示</h2><p id="profile-dialog-description"></p><button type="button" data-dialog-close>知道了</button></div></dialog>
  <div class="profile-snackbar" role="status" aria-live="polite" hidden><span></span></div>
  <script type="module" src="profile.js"></script>
</body>
</html>
